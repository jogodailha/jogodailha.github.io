<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pavões na Ilha das Enxadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
/* layout: jogo 3D em tela cheia; ficha do personagem no canto superior esquerdo, missão no direito, minimapa embaixo a direita, dialogo estilo RPG na base */
:root{--navy:#0d2247;--navy-2:#17346e;--gold:#f3cf7a;--paper:#f7f4ea;--ink:#0b1730;--alert:#e0452b;--good:#3fc46a;--display:"Cinzel",Georgia,serif;--body:"Montserrat",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--navy);overflow:hidden;font-family:var(--body);color:var(--paper);touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;background:rgba(13,34,71,.8);border:1px solid rgba(243,207,122,.55);border-radius:10px;padding:10px 14px;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#char{left:16px;top:14px;width:min(240px,50vw)}
.rank{margin:4px 0 6px}.rank h2{font:900 20px var(--display);color:var(--gold);margin:0 0 8px;letter-spacing:.06em}
#rk{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}#rk td{padding:6px 10px;border-bottom:1px solid rgba(243,207,122,.25);font-weight:700}#rk td:first-child{width:44px;color:var(--gold)}#rk td:last-child{text-align:right;white-space:nowrap}#rk tr.hi td{background:rgba(243,207,122,.22)}
.me{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.me input{flex:1;min-width:140px;font:700 16px var(--body);padding:10px 12px;border-radius:8px;border:2px solid var(--gold);background:#fff;color:var(--ink)}.me input:focus-visible{outline:3px solid #fff;outline-offset:2px}.me b{color:var(--gold);white-space:nowrap}.me button{font:800 14px var(--body);background:var(--good);color:#06210f;border:0;border-radius:8px;padding:11px 18px;cursor:pointer}.me button:disabled,.me input:disabled{opacity:.55;cursor:default}#rkmsg{min-height:20px;margin-top:8px;font-size:14px;font-weight:700;color:var(--gold)}
#dlg.win{max-height:94%;overflow:auto}#dlg.win #who{position:static;transform:none;display:inline-block;margin-bottom:10px}
.obj{margin-top:14px;padding:10px 12px;border-left:4px solid var(--gold);background:rgba(243,207,122,.13);border-radius:6px}
.stars{color:var(--gold);font-size:26px;letter-spacing:.12em}.stars i{color:rgba(255,255,255,.25);font-style:normal}
#char .nm{font-family:var(--display);font-weight:900;font-size:19px;color:var(--gold);letter-spacing:.06em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#lvl{font-family:var(--body);font-size:12px;font-weight:800;color:var(--paper);letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.row span{width:52px}.bar{flex:1;height:8px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px}#xpf{background:var(--gold)}#stf{background:#59b7f0}
#questp{right:16px;top:14px;max-width:min(300px,46vw);text-align:right}
#qname{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#qgoal{font-size:15px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
#mapp{right:16px;bottom:16px;padding:6px;line-height:0}
#map{width:230px;height:100px;max-width:42vw;height:auto;aspect-ratio:2.3}
#meter{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(300px,40vw);pointer-events:none;text-align:center}
#meterLabel{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 1px 6px #000;margin-bottom:6px}
#bar{height:14px;border-radius:8px;background:rgba(13,34,71,.8);border:1px solid rgba(243,207,122,.55);overflow:hidden}
#fill{height:100%;width:4%;background:var(--alert);transition:width .15s}
#toast{position:fixed;left:50%;top:24%;transform:translateX(-50%);background:rgba(13,34,71,.88);border:1px solid var(--gold);padding:10px 20px;border-radius:10px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:80vw}
#bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#0b1730;font-weight:700;font-size:14px;line-height:1.35;padding:9px 13px;border-radius:12px;max-width:260px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
#taf{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font:900 clamp(36px,9vw,112px) var(--display);color:var(--gold);text-shadow:0 4px 0 #0b1730,0 0 40px rgba(243,207,122,.6);letter-spacing:.02em;white-space:nowrap;opacity:0;transition:opacity .4s,letter-spacing 3s;pointer-events:none}
#buffs{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:6px;min-height:0}#buffs:empty{display:none}
.tag{position:fixed;transform:translate(-50%,-100%);font:800 11px var(--body);letter-spacing:.06em;color:var(--gold);background:rgba(13,34,71,.82);border:1px solid rgba(243,207,122,.5);padding:2px 8px;border-radius:6px;opacity:0;pointer-events:none;white-space:nowrap}
.bub{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#0b1730;font-weight:700;font-size:14px;line-height:1.35;padding:9px 13px;border-radius:12px;max-width:260px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4);margin-top:-6px}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(243,207,122,.85)}
#overlay{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px 28px;background:linear-gradient(180deg,rgba(6,14,32,.15),rgba(6,14,32,.7));box-sizing:border-box}
#dlg{position:relative;width:min(760px,100%);background:rgba(13,34,71,.96);border:2px solid var(--gold);border-radius:12px;padding:30px 28px 22px;box-shadow:0 20px 60px rgba(0,0,0,.55);box-sizing:border-box}
#who{position:absolute;left:22px;top:-2px;transform:translateY(-50%);background:var(--gold);color:var(--ink);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:5px 14px;border-radius:6px}
#dlg.jail{border-color:var(--alert)}#dlg.jail #who{background:var(--alert);color:#fff}
#ctitle{font-family:var(--display);font-weight:900;font-size:clamp(22px,4vw,30px);margin:0 0 10px;color:var(--gold);text-wrap:balance;line-height:1.1}
#dlg.jail #ctitle{color:#ff8a78}
#ctext{font-size:15.5px;line-height:1.55;font-weight:500;margin:0 0 18px;max-width:68ch}
#cbtn{font:800 15px var(--body);letter-spacing:.06em;background:var(--gold);color:var(--ink);border:0;border-radius:8px;padding:12px 24px;cursor:pointer;float:right}
#cbtn::after{content:" \25B8"}
#cbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}#cbtn:hover{filter:brightness(1.08)}
@media (max-width:560px){#meter{left:16px;transform:none;bottom:16px;width:38vw}#qgoal{font-size:13px}}
</style></head><body>
<canvas id="c"></canvas>
<div class="panel" id="char"><div class="nm">Cabo Velho <span id="lvl">Nível 1</span></div><div class="row"><span>XP</span><div class="bar"><i id="xpf"></i></div></div><div class="row"><span>Fôlego</span><div class="bar"><i id="stf"></i></div></div><div class="row"><span>Pontos</span><b id="pts" style="font-size:13px;letter-spacing:.04em">0</b></div><div id="buffs"></div></div>
<div class="panel" id="questp"><div id="qname">Missão 1 de 5</div><div id="qgoal">Recolher os pavões: 0 de 5</div></div>
<div class="panel" id="mapp"><canvas id="map"></canvas></div>
<div id="meter"><div id="meterLabel">Sinal de pavão</div><div id="bar"><div id="fill"></div></div></div>
<div id="toast"></div><div id="taf">CORRIDA DO TAF</div><div id="bubble"></div><div id="joy"><div id="knob"></div></div>
<div id="overlay"><div id="dlg"><div id="who">Sargento</div><h1 id="ctitle"></h1><p id="ctext"></p><button id="cbtn" type="button"></button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skClone } from 'three/addons/utils/SkeletonUtils.js';
try { await Promise.race([Promise.all(['700 40px Montserrat','900 40px Cinzel'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
// ---------- util ----------
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rr = (a, b) => a + rnd() * (b - a);
function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const FOGC = new THREE.Color().setRGB(0.86, 0.66, 0.50);
const FOGD = 0.00015;
scene.fog = new THREE.FogExp2(FOGC, FOGD);
const camera = new THREE.PerspectiveCamera(50, 16 / 9, 1, 40000);
const SUN = new THREE.Vector3(-0.62, 0.27, 0.52).normalize();

const sun = new THREE.DirectionalLight(0xffc890, 3.4);
sun.position.copy(SUN).multiplyScalar(800); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 100, far: 1600 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.4;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xa9c4ff, 0x6b5a48, 1.25));

// ---------- sky + water shaders ----------
const SKY = `
uniform vec3 uSun; uniform float uT;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*noise(p); p=p*2.03+7.1; a*=.5; } return s; }
vec3 skyColor(vec3 d){
  float h=clamp(d.y,0.,1.);
  vec3 zen=vec3(0.07,0.20,0.56), mid=vec3(0.28,0.48,0.84), hor=vec3(1.0,0.64,0.38);
  vec3 c=mix(hor,mid,smoothstep(0.,0.22,h)); c=mix(c,zen,smoothstep(0.12,0.85,h));
  float sd=max(dot(d,uSun),0.);
  c+=vec3(1.0,0.50,0.20)*pow(sd,5.)*0.55; c+=vec3(1.0,0.72,0.40)*pow(sd,50.)*0.9;
  return c;
}`;
const dome = new THREE.Mesh(new THREE.SphereGeometry(30000, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: SUN }, uT: { value: 0 } },
  vertexShader: `varying vec3 vD; void main(){ vD=position; vec4 p=modelViewMatrix*vec4(position,1.); gl_Position=projectionMatrix*p; }`,
  fragmentShader: SKY + `varying vec3 vD;
  void main(){ vec3 d=normalize(vD); vec3 c=skyColor(vec3(d.x,max(d.y,0.),d.z));
    float sd=max(dot(d,uSun),0.); c+=vec3(1.,.85,.6)*smoothstep(0.99972,0.99988,sd)*vec3(1.,.8,.55)*16.;
    if(d.y>0.015){ vec2 uv=d.xz/(d.y+0.16)*1.5+vec2(uT*0.006,0.); float n=fbm(uv);
      float cov=smoothstep(0.57,0.86,n)*smoothstep(0.015,0.16,d.y);
      vec3 cc=mix(vec3(0.62,0.46,0.50),vec3(1.0,0.84,0.66),smoothstep(0.5,0.9,n))+vec3(1.,.55,.25)*pow(sd,4.)*0.9;
      c=mix(c,cc,cov*0.7); }
    gl_FragColor=vec4(c,1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }` }));
dome.frustumCulled = false; scene.add(dome);

const water = new THREE.Mesh(new THREE.PlaneGeometry(80000, 80000).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: { uSun: { value: SUN }, uT: { value: 0 }, uFog: { value: FOGC }, uFogD: { value: FOGD } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader: SKY + `varying vec3 vW; uniform vec3 uFog; uniform float uFogD;
  float H(vec2 p){ return noise(p*0.045+vec2(uT*0.22,uT*0.1))*1.2+noise(p*0.13-vec2(uT*0.3,-uT*0.17))*0.55+noise(p*0.41+vec2(-uT*0.5,uT*0.6))*0.22+noise(p*1.3+uT)*0.07; }
  void main(){ vec3 V=cameraPosition-vW; float dist=length(V); V/=dist;
    float e=0.5+dist*0.004; float a=1.6/(1.+dist*0.0012); vec2 p=vW.xz; float h0=H(p);
    vec3 N=normalize(vec3(-(H(p+vec2(e,0.))-h0)/e*a,1.,-(H(p+vec2(0.,e))-h0)/e*a));
    vec3 R=reflect(-V,N); R.y=abs(R.y);
    float F=0.03+0.97*pow(1.-max(dot(N,V),0.),5.);
    vec3 deep=vec3(0.015,0.085,0.12);
    vec3 col=mix(deep,skyColor(R),F);
    float sp=pow(max(dot(R,uSun),0.),220.); col+=vec3(1.,0.78,0.5)*sp*9.;
    float f=1.-exp(-pow(dist*uFogD,2.)); col=mix(col,uFog,f);
    gl_FragColor=vec4(col,1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }` }));
scene.add(water);

// ---------- island ----------
const Y0 = 3.2; // ground level
const OUT = [[-235,-5],[-218,-52],[-160,-80],[-70,-92],[40,-98],[140,-95],[210,-72],[243,-28],[246,22],[222,62],[160,84],[60,92],[-40,88],[-130,78],[-200,52],[-230,22]];
const outPts = new THREE.CatmullRomCurve3(OUT.map(p => new THREE.Vector3(p[0], 0, p[1])), true).getPoints(240);
const mkShape = s => new THREE.Shape(outPts.map(p => new THREE.Vector2(p.x * s, -p.z * s)));
function inIsland(x, z, m = 0) { // point in polygon w/ margin by shrinking
  const k = 1 - m / 150; let c = false;
  for (let i = 0, j = outPts.length - 1; i < outPts.length; j = i++) {
    const xi = outPts[i].x * k, zi = outPts[i].z * k, xj = outPts[j].x * k, zj = outPts[j].z * k;
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c;
  } return c;
}
const stoneTex = canvasTex(256, 64, (g, w, h) => { g.fillStyle = '#9a9184'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < 4; y++) for (let x = 0; x < 9; x++) { g.fillStyle = `hsl(35,${8 + rnd() * 8}%,${48 + rnd() * 16}%)`; g.fillRect(x * 32 - (y % 2) * 16 + 1, y * 16 + 1, 30, 14); }
  g.fillStyle = 'rgba(40,50,40,.45)'; g.fillRect(0, h - 14, w, 14); }, { repeat: true });
const wall = new THREE.Mesh(new THREE.ExtrudeGeometry(mkShape(1), { depth: Y0, bevelEnabled: false }).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 1 }));
{ // wall uv
  const uv = wall.geometry.attributes.uv, pos = wall.geometry.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + pos.getZ(i)) / 14, pos.getY(i) / Y0);
}
wall.receiveShadow = true; wall.castShadow = true; scene.add(wall);
// shallow water halo
const halo = new THREE.Mesh(new THREE.ShapeGeometry(mkShape(1.06)).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x5fc0b0, transparent: true, opacity: 0.13, depthWrite: false }));
halo.position.y = 0.12; scene.add(halo);

// --- layout registry ---
const LAWN = { x0: 45, x1: 150, z0: -22, z1: 52 };
const POOL = { x0: -8, x1: 26, z0: 6, z1: 30 };
const blocks = []; // [cx,cz,w,d,rot] occupied
const HOUSES = [ // cx,cz,w,d,h,rot
  [-62, -68, 100, 20, 9, 0.02], [-152, -44, 48, 18, 8, 0.38], [-172, 16, 38, 16, 8, 1.45], [-138, 46, 52, 18, 8, -0.25],
  [-70, 58, 44, 16, 7, 0.05], [-90, -10, 58, 22, 10, 0], [-32, -28, 18, 36, 8, 0], [-14, 64, 28, 14, 6, 0], [192, -40, 30, 16, 8, 0.45], [212, 14, 18, 38, 8, 0.08]];
const MODERN = [[188, 56, 34, 16, 10, -0.42], [14, -70, 40, 16, 8, 0]];
const MAIN = { cx: 97, cz: -64, w: 108, d: 28, h: 15 };
HOUSES.concat(MODERN).forEach(h => blocks.push([h[0], h[1], h[2] + 6, h[3] + 6, h[5]]));
blocks.push([MAIN.cx, MAIN.cz, MAIN.w + 8, MAIN.d + 22, 0], [97.5, 15, 136, 106, 0], [9, 18, 50, 40, 0], [172, 30, 14, 60, 0], [166, -12, 8, 30, 0]);
function freeSpot(x, z) {
  if (!inIsland(x, z, 9)) return false;
  for (const b of blocks) { const dx = x - b[0], dz = z - b[1], c = Math.cos(b[4]), s = Math.sin(b[4]);
    const lx = dx * c - dz * s, lz = dx * s + dz * c; if (Math.abs(lx) < b[2] / 2 && Math.abs(lz) < b[3] / 2) return false; }
  return true;
}
// trees
const trees = [], palms = [];
const clusters = [[-205, -12, 30, 40], [-120, 15, 34, 26], [-30, 25, 16, 10], [-170, -15, 25, 14], [-100, 75, 40, 10], [-20, -55, 14, 8], [230, -5, 14, 8], [160, 72, 16, 6], [-60, 20, 26, 12], [-215, 25, 16, 10], [-10, -88, 30, 8], [170, -70, 22, 8]];
for (const [cx, cz, r, n] of clusters) for (let i = 0, k = 0; i < n && k < 400; k++) {
  const a = rnd() * 6.283, d = Math.sqrt(rnd()) * r, x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d;
  if (freeSpot(x, z) && !(z > 64 && x > -140 && x < 182)) { trees.push([x, z, rr(5, 9.5)]); i++; }
}
for (let i = 0; i < 26; i++) { const t = i / 26; palms.push([-28 + t * 60, 80 + Math.sin(i) * 1.5, rr(9, 13)]); }
for (let i = 0; i < 14; i++) { const a = 2.2 + i * 0.14; palms.push([-218 + Math.cos(a) * 6 + i * 2.5, 42 - i * 6.5, rr(9, 13)]); }
for (let i = 0; i < 10; i++) palms.push([160 + i * 7, -84 + i * 5.2, rr(8, 12)]);
const palmsOK = palms.filter(p => inIsland(p[0], p[1], 5));

// ground texture
const S = 4, GX = 256, GZ = 128;
const groundTex = canvasTex(2048, 1024, (g, w, h) => {
  const X = x => (x + GX) * S, Z = z => (z + GZ) * S;
  g.fillStyle = '#b3aa9a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${rnd() > 0.5 ? '255,250,235' : '70,60,50'},${rnd() * 0.07})`; g.fillRect(rnd() * w, rnd() * h, rr(2, 14), rr(2, 14)); }
  // paving grid lines
  g.strokeStyle = 'rgba(80,70,60,.10)'; g.lineWidth = 1; for (let x = 0; x < w; x += 24) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  // green patches under trees
  for (const [x, z, s] of trees) { g.fillStyle = `rgba(${60 + rnd() * 20},${105 + rnd() * 25},${45 + rnd() * 10},0.55)`; g.beginPath(); g.arc(X(x), Z(z), s * S * 1.5, 0, 7); g.fill(); }
